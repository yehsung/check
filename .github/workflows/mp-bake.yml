# 3D 아잉이 굽기 잠금(설계 F §7 · 마스터 계획 W0-d).
#
# aing-bake-lock   (ubuntu) 굽기 입력의 해시를 다시 재서 multiplatform/assets/aing-bake/lock.json 과 대조한다.
#                  입력이 바뀌었는데 다시 굽지 않았거나, 구운 파일이 잠금과 다르면 빨갛다 → Windows/Android 출시를 막는다.
#                  맥 출시는 막지 않는다. 망 봉인(unshare --net) 안에서 돈다.
# aing-bake-verify (macOS arm64, 실험) Metal 장치 유무(F-5)와 같은 칸을 러너에서 렌더한 원본 다이제스트(F-10)를 잰다.
#                  러너 Xcode 가 이 저장소를 못 빌드할 수 있어 실패해도 워크플로를 막지 않는다(continue-on-error).
name: mp-bake

on:
  push:
    paths:
      - "Sources/check/Resources/aing*"
      - "Sources/check/CheckCharacter3DView.swift"
      - "Sources/check/CheckOverlayReactions.swift"
      - "Sources/check/GoldAingFinish.swift"
      - "Sources/check/RainbowAingFinish.swift"
      - "Sources/check/MiniGameMascot.swift"
      - "Sources/check/Characters/**"
      - "Sources/CheckCore/CharacterKit/**"
      - "Tests/checkTests/AingBakeSuite.swift"
      - "multiplatform/assets/aing-bake/**"
      - "multiplatform/scripts/bake-aing/**"
      - ".github/workflows/mp-bake.yml"
  pull_request:
    paths:
      - "Sources/check/Resources/aing*"
      - "Sources/check/CheckCharacter3DView.swift"
      - "Sources/check/CheckOverlayReactions.swift"
      - "Sources/check/GoldAingFinish.swift"
      - "Sources/check/RainbowAingFinish.swift"
      - "Sources/check/MiniGameMascot.swift"
      - "Sources/check/Characters/**"
      - "Sources/CheckCore/CharacterKit/**"
      - "Tests/checkTests/AingBakeSuite.swift"
      - "multiplatform/assets/aing-bake/**"
      - "multiplatform/scripts/bake-aing/**"
      - ".github/workflows/mp-bake.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mp-bake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aing-bake-lock:
    name: aing-bake-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 망 봉인 카나리아 — 봉인 안에서는 바깥 연결이 실패해야 한다
        run: |
          sudo unshare --net -- python3 - <<'EOF'
          import socket, sys
          s = socket.socket()
          s.settimeout(3)
          try:
              s.connect(("1.1.1.1", 443))
          except OSError as e:
              print("봉인 확인(연결 실패):", e)
          else:
              sys.exit("봉인이 새었다 — 바깥 연결이 됐다")
          EOF
      - name: 잠금 대조(봉인 안)
        run: sudo unshare --net -- python3 multiplatform/scripts/bake-aing/bake.py check-lock --repo "$GITHUB_WORKSPACE"

  aing-bake-verify:
    name: aing-bake-verify (experiment F-5 · F-10)
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 도구 판
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: F-5 Metal 장치
        run: |
          cat > "$RUNNER_TEMP/metal.swift" <<'EOF'
          import Metal
          if let d = MTLCreateSystemDefaultDevice() {
              print("metal-device: \(d.name) lowPower=\(d.isLowPower) headless=\(d.isHeadless) registry=\(d.registryID)")
          } else {
              print("metal-device: none")
          }
          EOF
          swift "$RUNNER_TEMP/metal.swift"
      - name: 빌드
        run: swift build --build-tests 2>&1 | tail -40
      - name: F-10 같은 칸을 러너에서 렌더(망 봉인)
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          sandbox-exec -p '(version 1)(allow default)(deny network-outbound (remote ip "*:*"))' \
            env CHECK_AING_BAKE_PROBE_OUT="$RUNNER_TEMP/probe" \
            swift test --disable-sandbox --skip-build --no-parallel --filter 'AingBakeSuite/reproducibility' 2>&1 | tail -30
          python3 - "$RUNNER_TEMP/probe/probe.json" multiplatform/assets/aing-bake/lock.json <<'EOF'
          import json, os, sys
          probe = json.load(open(sys.argv[1]))
          print("gpu:", probe["gpu"])
          print("raw:", json.dumps(probe["raw"], sort_keys=True))
          if not os.path.isfile(sys.argv[2]):
              sys.exit("lock.json 이 커밋돼 있지 않다 — 위 raw 를 맥 굽기의 lock.json.raw 와 손으로 대조한다(아티팩트 aing-bake-probe)")
          lock = json.load(open(sys.argv[2]))["raw"]
          same = sorted(k for k, v in probe["raw"].items() if lock.get(k) == v)
          diff = sorted(k for k, v in probe["raw"].items() if lock.get(k) != v)
          print("same:", len(same), same)
          print("diff:", len(diff), diff)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aing-bake-probe
          path: ${{ runner.temp }}/probe
          if-no-files-found: ignore
