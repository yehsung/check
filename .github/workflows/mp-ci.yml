# Android·Windows(KMP) 매 푸시·PR 게이트 — A§5("매 푸시·PR"), K12. 비밀값 0개. 주소는 https://aingcheck.invalid 뿐이다.
# 트리거: main·xplat/** 푸시 + pull_request(어느 브랜치로든) + 수동 실행(수동 실행은 이 파일이 기본 브랜치에 있어야 버튼이 생긴다).
#   pull_request_target 은 쓰지 않는다(공개 저장소 — 포크 코드가 쓰기 권한·비밀과 같이 돌면 안 된다).
#   main 푸시에서도 돈다: Swift 엔진·픽스처만 고친 커밋도 지문이 어긋나면 빨강이어야 한다(§8-10 양쪽 잠금).
#  - golden-digest : 조건 없이 매 푸시·PR(§8-10). 스크립트(W0-b)가 아직 없으면 자리표시로 통과한다.
#  - lane-tools    : lanes.yml 확인 + lane-ownership 자기 시험 + 브랜치의 갈래 소유 검사.
#                    xplat/ 브랜치가 갈래(xplat/w<N>-<x>)·통합(xplat/w<N>-int·xplat/main → 조정자)으로 안 풀리면 빨강.
#  - jvm-gate      : ubuntu, sudo unshare -n 봉인 아래 빠른 게이트 + 봉인 없는 카나리아 빨강 대조(A-X15). changes 경로 필터로만 거른다.
#  - windows-x64   : windows-latest, java.exe 아웃바운드 차단 방화벽 봉인 아래 데스크톱 시험 + 대조(A-X16). changes 경로 필터로만 거른다.
# 대조는 scripts/canary-contrast.sh 가 '봉인이 새었다'는 이유의 빨강일 때만 통과시킨다. 봉인 게이트의 시험 결과는 대조 전에 따로 올린다.
# 액션은 SHA 로 고정한다(공개 저장소 공급망).
name: mp-ci

on:
  push:
    branches: ['main', 'xplat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mp: ${{ steps.filter.outputs.mp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        name: 멀티플랫폼 경로가 바뀌었나(A§5 경로 필터 — 무거운 잡만 이것으로 거른다)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT" in
            push) from="$BEFORE"; to="$GITHUB_SHA" ;;
            pull_request) from="$PR_BASE"; to="$PR_HEAD" ;;
            *) echo "mp=true" >> "$GITHUB_OUTPUT"; echo "이벤트 $EVENT → 전부 돈다"; exit 0 ;;
          esac
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$from^{commit}" 2>/dev/null || ! git cat-file -e "$to^{commit}" 2>/dev/null; then
            echo "mp=true" >> "$GITHUB_OUTPUT"; echo "비교 기준 없음($EVENT from=$from) → 전부 돈다"; exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then range="$from...$to"; else range="$from..$to"; fi
          if git diff --name-only "$range" \
             | grep -qE '^(multiplatform/|contract/|Tests/checkTests/Fixtures/|Sources/CheckMobileKit/Demo/Fixtures/|Sources/check/Characters/|\.github/workflows/mp-)'; then
            echo "mp=true" >> "$GITHUB_OUTPUT"
          else
            echo "mp=false" >> "$GITHUB_OUTPUT"
          fi

  golden-digest:
    # §8-10: 조건(needs·if·경로 필터) 없이 매 푸시·PR 에 돈다(수 초). 맥 엔진만 고친 커밋(main)에서도 지문이 어긋나면 빨강.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: golden-digest --check
        run: |
          if [ -f multiplatform/tools/golden-digest.py ]; then
            python3 -I multiplatform/tools/golden-digest.py --check
          else
            echo "::notice::multiplatform/tools/golden-digest.py 가 아직 없다 — W0-b 가 채운다(자리표시 통과)"
          fi

  lane-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: lanes.yml 확인 · 자기 시험(위반을 심은 가짜 diff 가 빨강)
        run: |
          python3 -I multiplatform/tools/lane-ownership.py --validate
          python3 -I multiplatform/tools/lane-ownership.py --self-test
      - name: 이 브랜치 갈래의 소유 검사(xplat/w1-a → W1-a · xplat/w0-int → 조정자 · 못 풀면 빨강)
        env:
          # PR 이면 머리 브랜치 이름과 머리 커밋(병합 커밋이 아니라 — main 쪽 변경이 섞이지 않게).
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          lane="$(python3 -I multiplatform/tools/lane-ownership.py --resolve-branch "$BRANCH")"
          if [ -z "$lane" ]; then echo "::notice::xplat/ 브랜치가 아니다($BRANCH) — 갈래 소유 검사 대상이 아니다"; exit 0; fi
          git fetch --no-tags origin "+refs/heads/xplat/main:refs/remotes/origin/xplat/main" "+refs/heads/main:refs/remotes/origin/main"
          echo "브랜치 $BRANCH → 갈래 $lane (기준 origin/xplat/main, 머리 $HEAD_SHA, 기준선 병합 몫은 origin/main 으로 뺀다)"
          # --upstream: main 이 바꾸고 머리가 바이트까지 그대로 가져온 경로(기준선 병합 몫, G §8-13)만 뺀다.
          # main 이 안 바꾼 경로를 main 판으로 되돌리는 것은 그대로 센다(lane-ownership.py 머리말 · self-test UPSTREAM_CASES).
          python3 -I multiplatform/tools/lane-ownership.py --lane "$lane" --base origin/xplat/main --head "$HEAD_SHA" --upstream origin/main

  jvm-gate:
    needs: changes
    if: needs.changes.outputs.mp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Android SDK 플랫폼(compileSdk 37 · build-tools 36)
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"
      - name: 의존 예열(봉인 밖 — 게이트가 아니다)
        run: bash multiplatform/scripts/gate-fast.sh --warm
      - name: 봉인 게이트(sudo unshare -n)
        id: sealed
        run: bash multiplatform/scripts/gate-fast.sh
      - name: 봉인 게이트 시험 결과 올리기(대조가 덮어쓰기 전에)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-gate-sealed-test-results
          path: |
            multiplatform/**/build/test-results/**/*.xml
            multiplatform/**/build/tripwire/*.txt
          if-no-files-found: error
          retention-days: 7
      - name: 대조 — 봉인 없이 카나리아는 '봉인이 새었다'로 빨강이어야 한다(A-X15)
        if: steps.sealed.outcome == 'success'
        run: bash multiplatform/scripts/canary-contrast.sh
      - name: 대조 결과 올리기
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-gate-contrast-results
          path: multiplatform/testkit/build/test-results/desktopTest/TEST-com.yehsung.aingcheck.testkit.seal.NetworkCanaryTest.xml
          if-no-files-found: ignore
          retention-days: 7

  windows-x64:
    needs: changes
    if: needs.changes.outputs.mp == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Android SDK 플랫폼(설정 단계가 compileSdk 37 을 찾는다)
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" --install "platforms;android-37.0" > /dev/null
          ls "$ANDROID_HOME/platforms"
      - name: 의존 예열(봉인 밖 — 게이트가 아니다)
        run: bash multiplatform/scripts/gate-fast.sh --warm
      - name: 방화벽 봉인 걸기(모든 JDK 의 java.exe 아웃바운드 차단)
        shell: pwsh
        run: |
          $before = Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultOutboundAction
          $before | Format-Table | Out-String | Write-Host
          Set-NetFirewallProfile -All -Enabled True
          $javas = @()
          $javas += Get-ChildItem -Path "$env:JAVA_HOME\bin" -Filter java*.exe -ErrorAction SilentlyContinue
          if (Test-Path 'C:\hostedtoolcache\windows') {
            $javas += Get-ChildItem -Path 'C:\hostedtoolcache\windows' -Recurse -Filter java*.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @('java.exe','javaw.exe') }
          }
          $javas = $javas | Where-Object { $_.Name -in @('java.exe','javaw.exe') } | Sort-Object FullName -Unique
          $i = 0
          foreach ($j in $javas) {
            New-NetFirewallRule -DisplayName "aingcheck-seal-$i" -Direction Outbound -Action Block -Program $j.FullName -Profile Any | Out-Null
            Write-Host "봉인: $($j.FullName)"
            $i++
          }
          if ($i -eq 0) { throw "막을 java.exe 를 찾지 못했다" }
      - name: 방화벽 봉인 게이트(데스크톱 JVM 시험)
        id: sealed
        env:
          AINGCHECK_EXTERNAL_SEAL: windows-firewall
        run: bash multiplatform/scripts/gate-fast.sh
      - name: 봉인 게이트 시험 결과 올리기(대조가 덮어쓰기 전에)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-sealed-test-results
          path: |
            multiplatform/**/build/test-results/**/*.xml
            multiplatform/**/build/tripwire/*.txt
          if-no-files-found: error
          retention-days: 7
      - name: 방화벽 봉인 풀기
        if: always()
        shell: pwsh
        run: |
          Get-NetFirewallRule -DisplayName 'aingcheck-seal-*' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          Write-Host "봉인 규칙 제거"
      - name: 대조 — 봉인 없이 카나리아는 '봉인이 새었다'로 빨강이어야 한다(A-X16)
        if: steps.sealed.outcome == 'success'
        run: bash multiplatform/scripts/canary-contrast.sh
      - name: 대조 결과 올리기
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-contrast-results
          path: multiplatform/testkit/build/test-results/desktopTest/TEST-com.yehsung.aingcheck.testkit.seal.NetworkCanaryTest.xml
          if-no-files-found: ignore
          retention-days: 7
