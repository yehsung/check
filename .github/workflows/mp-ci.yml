# Android·Windows(KMP) 매 푸시·PR 게이트 — A§5("매 푸시·PR"), K12. 비밀값 0개. 주소는 https://aingcheck.invalid 뿐이다.
# 트리거: main·xplat/** 푸시 + pull_request(어느 브랜치로든) + 수동 실행(수동 실행은 이 파일이 기본 브랜치에 있어야 버튼이 생긴다).
#   pull_request_target 은 쓰지 않는다(공개 저장소 — 포크 코드가 쓰기 권한·비밀과 같이 돌면 안 된다).
#   main 푸시에서도 돈다: Swift 엔진·픽스처만 고친 커밋도 지문이 어긋나면 빨강이어야 한다(§8-10 양쪽 잠금).
#  - golden-digest : 조건 없이 매 푸시·PR(§8-10). 스크립트(W0-b)가 아직 없으면 자리표시로 통과한다.
#  - lane-tools    : lanes.yml 확인 + lane-ownership 자기 시험 + 브랜치의 갈래 소유 검사.
#                    xplat/ 브랜치가 갈래(xplat/w<N>-<x>)·통합(xplat/w<N>-int·xplat/main → 조정자)으로 안 풀리면 빨강.
#  - jvm-gate      : ubuntu, sudo unshare -n 봉인 아래 빠른 게이트 + 봉인 없는 카나리아 빨강 대조(A-X15). changes 경로 필터로만 거른다.
#                    경로 필터의 Sources/ 는 통째다(W1-e): ui 시험이 Swift 원문(SF 기호 대응·팔레트 대조)과 맥 그림(Gradle Sync)을 읽는다.
#  - windows-x64   : windows-latest, java.exe 아웃바운드 차단 방화벽 봉인 아래 데스크톱 시험 + 대조(A-X16). changes 경로 필터로만 거른다.
#  - windows-arm64 : windows-11-arm, 같은 방화벽 봉인 게이트(W1-f ① 러너 2종). Android SDK 를 받고 OOBE 화면을 걷는 준비 단계가 더 있다.
#  - landing-unit  : ubuntu, landing 글자 검사(check-glyphs) + sudo unshare -n 봉인 아래 단위 시험(W2-i 검증 지적 — CI·gate-fast 어디에도
#                    landing 이 없었다). changes 의 landing 경로 필터로만 거른다(landing/ · docs/privacy.md · 이 파일).
# 대조는 scripts/canary-contrast.sh 가 '봉인이 새었다'는 이유의 빨강일 때만 통과시킨다. 봉인 게이트의 시험 결과는 대조 전에 따로 올린다.
# 액션은 SHA 로 고정한다(공개 저장소 공급망).
name: mp-ci

on:
  push:
    branches: ['main', 'xplat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mp: ${{ steps.filter.outputs.mp }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        name: 멀티플랫폼 경로가 바뀌었나(A§5 경로 필터 — 무거운 잡만 이것으로 거른다)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT" in
            push) from="$BEFORE"; to="$GITHUB_SHA" ;;
            pull_request) from="$PR_BASE"; to="$PR_HEAD" ;;
            *) { echo "mp=true"; echo "landing=true"; } >> "$GITHUB_OUTPUT"; echo "이벤트 $EVENT → 전부 돈다"; exit 0 ;;
          esac
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$from^{commit}" 2>/dev/null || ! git cat-file -e "$to^{commit}" 2>/dev/null; then
            { echo "mp=true"; echo "landing=true"; } >> "$GITHUB_OUTPUT"; echo "비교 기준 없음($EVENT from=$from) → 전부 돈다"; exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then range="$from...$to"; else range="$from..$to"; fi
          if git diff --name-only "$range" \
             | grep -qE '^(multiplatform/|contract/|Tests/checkTests/Fixtures/|Sources/|\.github/workflows/mp-)'; then
            echo "mp=true" >> "$GITHUB_OUTPUT"
          else
            echo "mp=false" >> "$GITHUB_OUTPUT"
          fi
          # landing: 단위 시험이 docs/privacy.md 도 읽는다(계정 삭제 페이지의 백업 고지 ↔ 처리방침 확정 줄 맞물림).
          #   목록을 변수로 받아 here-string 으로 거른다 — grep -q 가 일찍 끝나 앞 단계가 SIGPIPE 로 죽으면 pipefail 이 '안 바뀜'으로 뒤집는다.
          changed="$(git diff --name-only "$range")"
          if grep -E '^(landing/|docs/privacy\.md$|\.github/workflows/mp-ci\.yml$)' <<<"$changed" > /dev/null; then
            echo "landing=true" >> "$GITHUB_OUTPUT"
          else
            echo "landing=false" >> "$GITHUB_OUTPUT"
          fi

  golden-digest:
    # §8-10: 조건(needs·if·경로 필터) 없이 매 푸시·PR 에 돈다(수 초). 맥 엔진만 고친 커밋(main)에서도 지문이 어긋나면 빨강.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: golden-digest --check · 도구 자기 시험(W0-b)
        run: |
          if [ -f multiplatform/tools/golden-digest.py ]; then
            set -euo pipefail
            python3 -I multiplatform/tools/golden-digest.py --check
            # 결함을 심은 사본에서 --check 가 빨개지는지(주석만 바꾼 소스는 초록 · 코드·골든 바이트·고아는 빨강).
            python3 -I multiplatform/tools/golden-digest.py --self-test
            # INV 스캐너(C§4.2): 자기 시험 + 개수(기록용 — 0.3.62 기준선 671 = core 240 · mac 133 · phone 298. C 의 686 은 옛 기준선).
            python3 -I multiplatform/tools/port-invariants.py --self-test
            python3 -I multiplatform/tools/port-invariants.py
          else
            echo "::notice::multiplatform/tools/golden-digest.py 가 아직 없다 — W0-b 가 채운다(자리표시 통과)"
          fi

  swift-golden:
    # 수동 참고용(A§9-14 · G §8-1): Swift 골든 비교 모드의 정본은 이 맥의 scripts/golden-export.sh(맥 전체 스위트)다.
    # 러너의 Xcode 판이 이 맥(Xcode 27 · Swift 6.4)과 다를 수 있어 결과는 참고만 한다 — 실패해도 워크플로를 빨갛게 하지 않는다.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swift 판
        run: swift --version
      - name: golden-export 비교 모드(sandbox-exec 봉인)
        run: bash scripts/golden-export.sh

  lane-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: lanes.yml 확인 · 자기 시험(위반을 심은 가짜 diff 가 빨강)
        run: |
          python3 -I multiplatform/tools/lane-ownership.py --validate
          python3 -I multiplatform/tools/lane-ownership.py --self-test
      - name: 이 브랜치 갈래의 소유 검사(xplat/w1-a → W1-a · xplat/w0-int → 조정자 · 못 풀면 빨강)
        env:
          # PR 이면 머리 브랜치 이름과 머리 커밋(병합 커밋이 아니라 — main 쪽 변경이 섞이지 않게).
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          lane="$(python3 -I multiplatform/tools/lane-ownership.py --resolve-branch "$BRANCH")"
          if [ -z "$lane" ]; then echo "::notice::xplat/ 브랜치가 아니다($BRANCH) — 갈래 소유 검사 대상이 아니다"; exit 0; fi
          git fetch --no-tags origin "+refs/heads/xplat/main:refs/remotes/origin/xplat/main" "+refs/heads/main:refs/remotes/origin/main"
          echo "브랜치 $BRANCH → 갈래 $lane (기준 origin/xplat/main, 머리 $HEAD_SHA, 기준선 병합 몫은 origin/main 으로 뺀다)"
          # --upstream: main 이 바꾸고 머리가 바이트까지 그대로 가져온 경로(기준선 병합 몫, G §8-13)만 뺀다.
          # main 이 안 바꾼 경로를 main 판으로 되돌리는 것은 그대로 센다(lane-ownership.py 머리말 · self-test UPSTREAM_CASES).
          python3 -I multiplatform/tools/lane-ownership.py --lane "$lane" --base origin/xplat/main --head "$HEAD_SHA" --upstream origin/main

  landing-unit:
    # landing(웹 계정 삭제 /delete-account 등)의 회귀 방어(W2-i 검증 지적). next build 는 하지 않는다(배포는 사람이 Vercel CLI 로).
    #  - 글자 검사: prebuild 와 같은 check-glyphs — 서브셋(public/fonts)에 없는 한글이 있으면 Vercel 빌드가 깨진다. 새 문구를 병합하며
    #    글꼴 서브셋 갱신(npm run subset)을 빠뜨리면 여기서 빨강이다.
    #  - 단위 시험: 실서버 0(가짜 fetch). jvm-gate 와 같은 sudo unshare -n 봉인(lo 만) 아래에서, 봉인이 걸렸는지 먼저 확인한다.
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 로컬(맥) 실측 판. test:unit 은 --experimental-strip-types 라 22.6 이상이어야 한다.
          node-version: '22.13.1'
          package-manager-cache: false
      - name: 의존 받기(봉인 밖 — 설치 스크립트는 돌리지 않는다)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 글자 검사(prebuild 의 check-glyphs)
        run: node scripts/check-glyphs.mjs
      - name: 단위 시험 — sudo unshare -n 봉인(lo 만) 아래
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/landing-sealed.sh" <<'SH'
          set -euo pipefail
          # 봉인 확인: 바깥 연결이 실패해야 한다(되면 봉인이 샌 것 — 빨강).
          if node -e 'fetch("https://example.com").then(() => process.exit(0), () => process.exit(1))'; then
            echo "::error::봉인이 새었다 — 봉인 안에서 바깥 연결이 됐다"; exit 1
          fi
          echo "봉인 확인: 바깥 연결 실패(정상)"
          npm run test:unit
          SH
          # gate-fast.sh 의 Linux 봉인과 같은 꼴: 루트로 새 망 이름공간 → lo 만 올림 → 원래 사용자·PATH·HOME 으로 내려온다.
          sudo -n unshare --net -- /bin/sh -c '
            ip link set lo up || exit 3
            user="$1"; path="$2"; home="$3"; shift 3
            exec sudo -n -E -u "$user" env PATH="$path" HOME="$home" /bin/bash "$@"
          ' sh "$(id -un)" "$PATH" "$HOME" "$RUNNER_TEMP/landing-sealed.sh"

  jvm-gate:
    needs: changes
    if: needs.changes.outputs.mp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Android SDK 플랫폼(compileSdk 37 · build-tools 36)
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"
      - name: 의존 예열(봉인 밖 — 게이트가 아니다)
        run: bash multiplatform/scripts/gate-fast.sh --warm
      - name: 봉인 게이트(sudo unshare -n)
        id: sealed
        run: bash multiplatform/scripts/gate-fast.sh
      - name: 봉인 게이트 시험 결과 올리기(대조가 덮어쓰기 전에)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-gate-sealed-test-results
          path: |
            multiplatform/**/build/test-results/**/*.xml
            multiplatform/**/build/tripwire/*.txt
          if-no-files-found: error
          retention-days: 7
      - name: 대조 — 봉인 없이 카나리아는 '봉인이 새었다'로 빨강이어야 한다(A-X15)
        if: steps.sealed.outcome == 'success'
        run: bash multiplatform/scripts/canary-contrast.sh
      - name: 대조 결과 올리기
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-gate-contrast-results
          path: multiplatform/testkit/build/test-results/desktopTest/TEST-com.yehsung.aingcheck.testkit.seal.NetworkCanaryTest.xml
          if-no-files-found: ignore
          retention-days: 7

  windows-x64:
    needs: changes
    if: needs.changes.outputs.mp == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Android SDK 플랫폼(설정 단계가 compileSdk 37 을 찾는다)
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" --install "platforms;android-37.0" > /dev/null
          ls "$ANDROID_HOME/platforms"
      - name: 의존 예열(봉인 밖 — 게이트가 아니다)
        run: bash multiplatform/scripts/gate-fast.sh --warm
      - name: 방화벽 봉인 걸기(모든 JDK 의 java.exe 아웃바운드 차단)
        shell: pwsh
        run: |
          $before = Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultOutboundAction
          $before | Format-Table | Out-String | Write-Host
          Set-NetFirewallProfile -All -Enabled True
          $javas = @()
          $javas += Get-ChildItem -Path "$env:JAVA_HOME\bin" -Filter java*.exe -ErrorAction SilentlyContinue
          if (Test-Path 'C:\hostedtoolcache\windows') {
            $javas += Get-ChildItem -Path 'C:\hostedtoolcache\windows' -Recurse -Filter java*.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @('java.exe','javaw.exe') }
          }
          $javas = $javas | Where-Object { $_.Name -in @('java.exe','javaw.exe') } | Sort-Object FullName -Unique
          $i = 0
          foreach ($j in $javas) {
            New-NetFirewallRule -DisplayName "aingcheck-seal-$i" -Direction Outbound -Action Block -Program $j.FullName -Profile Any | Out-Null
            Write-Host "봉인: $($j.FullName)"
            $i++
          }
          if ($i -eq 0) { throw "막을 java.exe 를 찾지 못했다" }
      - name: 방화벽 봉인 게이트(데스크톱 JVM 시험)
        id: sealed
        env:
          AINGCHECK_EXTERNAL_SEAL: windows-firewall
        run: bash multiplatform/scripts/gate-fast.sh
      - name: 봉인 게이트 시험 결과 올리기(대조가 덮어쓰기 전에)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-sealed-test-results
          path: |
            multiplatform/**/build/test-results/**/*.xml
            multiplatform/**/build/tripwire/*.txt
          if-no-files-found: error
          retention-days: 7
      - name: 방화벽 봉인 풀기
        if: always()
        shell: pwsh
        run: |
          Get-NetFirewallRule -DisplayName 'aingcheck-seal-*' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          Write-Host "봉인 규칙 제거"
      - name: 대조 — 봉인 없이 카나리아는 '봉인이 새었다'로 빨강이어야 한다(A-X16)
        if: steps.sealed.outcome == 'success'
        run: bash multiplatform/scripts/canary-contrast.sh
      - name: 대조 결과 올리기
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-contrast-results
          path: multiplatform/testkit/build/test-results/desktopTest/TEST-com.yehsung.aingcheck.testkit.seal.NetworkCanaryTest.xml
          if-no-files-found: ignore
          retention-days: 7

  windows-arm64:
    # W1-f(Windows OS 층)의 러너 2종 중 arm64 몫(G §2-3 W1-f ①). x64 잡과 같은 방화벽 봉인 게이트를 windows-11-arm 에서 돈다.
    # 이 이미지에는 Android SDK 가 없다(actions/partner-runner-images arm-windows-11-image.md "Omitted software: Android") —
    # 설정 단계가 compileSdk 37 을 찾으므로 cmdline-tools 를 sha1 고정으로 받아 플랫폼만 넣는다(봉인 밖 예열 단계).
    # cmdline-tools 는 22.0(15859902)이다 — 23.0(16111833)의 sdkmanager 는 'Android CLI' 를 내려받아 넘겨주고 --sdk_root 에
    # 아무것도 설치하지 않았다(xplat/int-b 첫 실행 run 39655694065: platforms 폴더 없음). 22.0 의 sdkmanager 는 이 맥에서
    # 같은 명령으로 platforms/android-37.0(package.xml 포함)을 깔고, AGP 가 그 플랫폼을 알아본다(실측).
    # 트레이 시험 전에 OOBE 개인정보 화면을 걷는다(W0-e 실측: 이 화면이 대화형 데스크톱을 덮으면 NIM_ADD 가 0x80004005, G §8-12).
    needs: changes
    if: needs.changes.outputs.mp == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: (arm64 준비) OOBE 개인정보 화면 걷기 · OneDrive 동기화 앱 끄기 — 맨 앞에서(G §8-12, mp-windows-spike.yml 과 같은 걷기)
        # OOBE 화면을 닫으면 멈춰 있던 첫 로그온이 이어지고 셸이 %USERPROFILE%\OneDrive 를 만든다. 예열 뒤·게이트 직전에 걸었을 때는
        # 그 폴더가 게이트 도중(닫고 2~4분 뒤)에 생겨 홈 잔재 검사가 빨갰다(run 39657334138 — 시험 258 · 실패 0, 잔재 'OneDrive').
        # 시험 JVM 의 HOME·USERPROFILE 은 빌드 폴더로 돌려져 있어 이 폴더는 시험이 남긴 것이 아니다. 그래서 잔재 규칙은 그대로 두고
        # 걷기를 맨 앞으로 옮겨(SDK·예열 동안 첫 로그온이 끝난다) OneDrive 동기화 앱을 정책으로 끈다.
        shell: pwsh
        run: |
          $re = 'CloudExperienceHost|WWAHost|UserOOBEBroker|PrivacyExperience'
          $before = @(Get-Process | Where-Object { $_.ProcessName -match $re } | ForEach-Object { "$($_.ProcessName)@$($_.SessionId)" })
          New-Item -Force -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE' | Out-Null
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE' -Name DisablePrivacyExperience -Value 1 -Type DWord
          New-Item -Force -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive' | Out-Null
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive' -Name DisableFileSyncNGSC -Value 1 -Type DWord
          Get-Process | Where-Object { $_.ProcessName -match $re } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.ProcessName -match '^OneDrive' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          $after = @(Get-Process | Where-Object { $_.ProcessName -match $re } | ForEach-Object { "$($_.ProcessName)@$($_.SessionId)" })
          "OOBE 앞: $($before -join ', ') / 뒤: $($after -join ', ') / OneDrive 폴더: $(Test-Path (Join-Path $env:USERPROFILE 'OneDrive'))"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: microsoft
          java-version: '21'
          architecture: aarch64
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Android SDK 도구(이 이미지엔 SDK 가 없다 — cmdline-tools 22.0 · 15859902 sha1 고정, Google repository2-3.xml)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'android-sdk'
          $zip = Join-Path $env:RUNNER_TEMP 'cmdline-tools.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip' -OutFile $zip
          $h = (Get-FileHash -Algorithm SHA1 $zip).Hash.ToLowerInvariant()
          if ($h -ne 'b9862337a13e2809a5159dc3a08d058091bd59f6') { throw "cmdline-tools sha1 불일치: $h" }
          $stage = Join-Path $env:RUNNER_TEMP 'cmdline-stage'
          Expand-Archive -Path $zip -DestinationPath $stage -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'cmdline-tools') | Out-Null
          Move-Item (Join-Path $stage 'cmdline-tools') (Join-Path $root 'cmdline-tools\latest')
          "ANDROID_HOME=$root" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$root" >> $env:GITHUB_ENV
      - name: Android SDK 플랫폼 설치(compileSdk 37 — 깔린 자리에 package.xml 이 없으면 빨강)
        run: |
          log="$RUNNER_TEMP/sdkmanager.log"
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" > "$log" 2>&1 \
            || { tail -40 "$log"; exit 1; }
          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/package.xml" ]; then
            tail -40 "$log"; echo "::error::platforms;android-37.0 이 $ANDROID_HOME 에 깔리지 않았다"; exit 1
          fi
          ls "$ANDROID_HOME/platforms"
      - name: 파이썬 확인(게이트가 결과 XML 을 python3·python 으로 읽는다 — 이 이미지에 있는지 먼저 드러낸다)
        run: |
          for c in python3 python; do
            if command -v "$c" >/dev/null 2>&1 && "$c" -c 'import sys; print(sys.version)'; then exit 0; fi
          done
          echo "::error::python3·python 이 없다 — gate-fast.sh 가 카나리아 결과를 못 읽는다(actions/setup-python 을 SHA 로 고정해 더할 것)"
          exit 1
      - name: 의존 예열(봉인 밖 — 게이트가 아니다)
        run: bash multiplatform/scripts/gate-fast.sh --warm
      - name: 방화벽 봉인 걸기(모든 JDK 의 java.exe 아웃바운드 차단)
        shell: pwsh
        run: |
          $before = Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultOutboundAction
          $before | Format-Table | Out-String | Write-Host
          Set-NetFirewallProfile -All -Enabled True
          $javas = @()
          $javas += Get-ChildItem -Path "$env:JAVA_HOME\bin" -Filter java*.exe -ErrorAction SilentlyContinue
          # 파트너 이미지의 도구 캐시 자리가 C:\hostedtoolcache 가 아닐 수 있어 RUNNER_TOOL_CACHE 도 훑는다.
          foreach ($cache in @($env:RUNNER_TOOL_CACHE, 'C:\hostedtoolcache\windows') | Where-Object { $_ } | Sort-Object -Unique) {
            if (Test-Path $cache) {
              $javas += Get-ChildItem -Path $cache -Recurse -Filter java*.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @('java.exe','javaw.exe') }
            }
          }
          $javas = $javas | Where-Object { $_.Name -in @('java.exe','javaw.exe') } | Sort-Object FullName -Unique
          $i = 0
          foreach ($j in $javas) {
            New-NetFirewallRule -DisplayName "aingcheck-seal-$i" -Direction Outbound -Action Block -Program $j.FullName -Profile Any | Out-Null
            Write-Host "봉인: $($j.FullName)"
            $i++
          }
          if ($i -eq 0) { throw "막을 java.exe 를 찾지 못했다" }
      - name: 방화벽 봉인 게이트(데스크톱 JVM 시험)
        id: sealed
        env:
          AINGCHECK_EXTERNAL_SEAL: windows-firewall
        run: |
          echo "HOME 꼭대기(게이트 직전 — 잔재 검사의 기준): $(ls -A "$HOME" | tr '\n' ' ')"
          bash multiplatform/scripts/gate-fast.sh
      - name: 봉인 게이트 시험 결과 올리기(대조가 덮어쓰기 전에)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm64-sealed-test-results
          path: |
            multiplatform/**/build/test-results/**/*.xml
            multiplatform/**/build/tripwire/*.txt
          if-no-files-found: error
          retention-days: 7
      - name: 방화벽 봉인 풀기
        if: always()
        shell: pwsh
        run: |
          Get-NetFirewallRule -DisplayName 'aingcheck-seal-*' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          Write-Host "봉인 규칙 제거"
      - name: 대조 — 봉인 없이 카나리아는 '봉인이 새었다'로 빨강이어야 한다(A-X16)
        if: steps.sealed.outcome == 'success'
        run: bash multiplatform/scripts/canary-contrast.sh
      - name: 대조 결과 올리기
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm64-contrast-results
          path: multiplatform/testkit/build/test-results/desktopTest/TEST-com.yehsung.aingcheck.testkit.seal.NetworkCanaryTest.xml
          if-no-files-found: ignore
          retention-days: 7
