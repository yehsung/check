# Android·Windows(KMP) 야간·수동 — A§5. 비밀값 0개.
# 주의: schedule·workflow_dispatch 는 이 파일이 **기본 브랜치(main)** 에 있어야 돈다. 그 전까지는 정의만 있다.
#  - gate-full-linux : unshare 봉인 아래 전체 게이트(slow·lint·assembleRelease(.invalid)·jar). 기기 계측은 빠진다(로그에 "기기 계측 빠짐").
#                      기기 계측은 맥에서만 돈다: gate-full.sh → emu.sh instrumented(sandbox-exec 봉인·CGWindowList 창 0 — 맥 전용).
#                      Linux 러너용 봉인 에뮬레이터 잡은 아직 없다(KVM·봉인 방식이 다르다 — 조정자 후속).
#  - (windows-arm64 는 뺐다 — 5차 int-d, G §8-16) 옛 절차(cmdline-tools latest · OOBE·OneDrive 처리 없음)라 main 에 오르면 빨갛고,
#    같은 windows-11-arm 방화벽 봉인 게이트를 mp-ci windows-arm64 가 매 푸시에 돈다(cmdline-tools 22.0 고정 · OOBE 걷기 · OneDrive 끔).
#  - release-dryrun  : 봉인 아래 assembleRelease(.invalid) → APK 네이티브 점검(G §8-12): .so 허용 목록 + 16 KB 정렬
#                      (zipalign -c -P 16 · PT_LOAD p_align ≥ 0x4000). 옛 "lib/ 0개" 기준은 버렸다(Compose 가 .so 를 싣는다).
#                      → APK 내용 점검(W1-g ⑦): 자기 시험(가짜 APK 양성 대조) 뒤 진짜 APK 의 assets Fixtures 0 · dex 운영 주소 0.
name: mp-nightly

on:
  schedule:
    - cron: '17 18 * * *' # 매일 03:17 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mp-nightly
  cancel-in-progress: true

jobs:
  gate-full-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Android SDK 플랫폼
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: 의존 예열(봉인 밖)
        run: bash multiplatform/scripts/gate-fast.sh --warm
      - name: 전체 게이트(봉인, 기기 계측 제외)
        env:
          AINGCHECK_ALLOW_NO_DEVICE: '1'
        run: bash multiplatform/scripts/gate-full.sh
      - name: 시험 결과 올리기
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-full-linux-results
          path: multiplatform/**/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  release-dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Android SDK 플랫폼
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: 의존 예열(봉인 밖)
        run: bash multiplatform/scripts/gate-fast.sh --warm
      - name: assembleRelease(.invalid) 를 봉인 아래에서
        working-directory: multiplatform
        run: |
          sudo -n unshare --net -- /bin/sh -c 'ip link set lo up && exec sudo -n -E -u "$1" env PATH="$2" HOME="$3" ./gradlew --offline --no-daemon :androidApp:assembleRelease' sh "$(id -un)" "$PATH" "$HOME"
      - name: APK 네이티브 점검(.so 허용 목록 + 16 KB 정렬, G §8-12)
        working-directory: multiplatform
        run: |
          apk="$(ls androidApp/build/outputs/apk/release/*.apk | head -1)"
          bash scripts/apk-native-check.sh "$apk"
      - name: APK 내용 점검 자기 시험(가짜 APK 넷 — Fixtures·운영 주소를 잡고 깨끗한 판은 통과, W1-g ⑦ 양성 대조)
        working-directory: multiplatform
        run: bash scripts/apk-content-check.sh --self-test
      - name: APK 내용 점검(assets Fixtures 0 · dex 운영 주소 0 · .invalid 기준선, W1-g ⑦)
        working-directory: multiplatform
        run: |
          apk="$(ls androidApp/build/outputs/apk/release/*.apk | head -1)"
          bash scripts/apk-content-check.sh "$apk" --expect-invalid
