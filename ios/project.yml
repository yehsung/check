# aing-check iOS — XcodeGen 명세(개발 도구, 앱에 실리지 않는다).
#
# 생성: `cd ios && xcodegen generate` → ios/AingCheck.xcodeproj (생성물은 커밋하지 않는다 — 이 파일이 원본).
# 화면·스토어 코드는 저장소 루트 Swift 패키지(CheckMobileKit · CheckWidgetsKit → CheckCore)에 두고,
# 여기 두 타깃은 @main 껍데기만 가진다. 에이전트가 고치기 쉽고 병합 충돌이 적다(계획서 "iOS 앱" 절).
#
# 식별자(SPEC-ios §1): 앱 com.yehsung.aingcheck · 위젯 com.yehsung.aingcheck.widgets ·
# App Group group.com.yehsung.aingcheck · 키체인 그룹 MQ2KQK37WD.com.yehsung.aingcheck.shared · 팀 MQ2KQK37WD.
# 맥 번들 ID(kingcheck)와는 별개다. 두 타깃이 같은 App Group·키체인 그룹을 가진다 — 위젯이 앱이 쓴 스냅샷과
# 토큰을 읽는다(위젯은 토큰 갱신을 하지 않는다 — SPEC-ios §4). 값은 Sources/CheckMobileShared 의 상수와 같아야 한다.
name: AingCheck

options:
  bundleIdPrefix: com.yehsung
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: ko

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: MQ2KQK37WD
    CODE_SIGN_STYLE: Automatic
    # 아이폰 전용
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "12"
  configs:
    # 푸시 환경: Debug 는 APNs sandbox, Release(TestFlight·App Store)는 production. 앱 엔타이틀먼트가 APS_ENVIRONMENT 를,
    # Info.plist 의 AingAPNsEnvironment 가 AING_APNS_ENVIRONMENT 를 읽는다(register_device 의 p_apns_env — 서버 어휘 sandbox/production).
    Debug:
      APS_ENVIRONMENT: development
      AING_APNS_ENVIRONMENT: sandbox
    Release:
      APS_ENVIRONMENT: production
      AING_APNS_ENVIRONMENT: production

packages:
  # 저장소 루트 패키지(Package.swift). 이름은 패키지 선언의 name 과 같아야 한다.
  check:
    path: ..

targets:
  AingCheck:
    type: application
    platform: iOS
    sources:
      - path: App
    # w5/e2e: 실서버 e2e UI 테스트(AingCheckUITests)를 이 스킴의 test 에 싣는다. build/run 은 전과 같다(-scheme AingCheck build 영향 없음).
    # 실행 방법은 ios/UITests/AingCheckE2ETests.swift 머리 주석 — 자격 증명은 TEST_RUNNER_AING_E2E_* 환경변수로만, 없으면 전부 skip.
    scheme:
      testTargets:
        - AingCheckUITests
    # D-base: Supabase anon 키는 커밋하지 않는다. ios/scripts/sync-local-config.sh 가 저장소 루트 .env.local 에서
    # ios/Config/Local.xcconfig(gitignore)를 만들고, 아래 xcconfig 가 그것을 있으면 포함한다(없어도 빌드는 된다 — 데모 모드만 동작).
    configFiles:
      Debug: Config/AingCheck.xcconfig
      Release: Config/AingCheck.xcconfig
    dependencies:
      - package: check
        product: CheckMobileKit
      - target: AingCheckWidgets
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 아잉체크
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # D9 푸시 받기 자리 — 원격 알림으로 깨어나는 백그라운드 모드
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
        # 120Hz 화면에서 미니게임이 60Hz 에 묶이지 않게(맥의 60Hz 고정 상한 저더 전례 — SPEC-ios §1)
        CADisableMinimumFrameDurationOnPhone: true
        # 딥링크 aingcheck://…(푸시·위젯 — Sources/CheckMobileShared/AingRoute.swift)
        CFBundleURLTypes:
          - CFBundleURLName: com.yehsung.aingcheck
            CFBundleURLSchemes:
              - aingcheck
        # register_device 의 p_apns_env(Debug sandbox / Release production — MobileAppInfo.apnsEnvironmentInfoKey)
        AingAPNsEnvironment: $(AING_APNS_ENVIRONMENT)
    entitlements:
      path: App/AingCheck.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - group.com.yehsung.aingcheck
        keychain-access-groups:
          - MQ2KQK37WD.com.yehsung.aingcheck.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yehsung.aingcheck
        PRODUCT_NAME: AingCheck
        # 아이폰 전용. **타깃 단에 다시 적어야 한다** — XcodeGen 의 iOS 앱 기본 설정이 타깃 단에 "1,2" 를 넣어
        # 프로젝트 단 값을 덮는다(실측: 프로젝트 단에만 두면 빌드된 Info.plist 의 UIDeviceFamily 가 [1, 2]).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # 앱 아이콘: App/Assets.xcassets/AppIcon(맥 packaging/appicon/icon-1024.png 에서 여백·투명 모서리를 걷어 낸 1024 한 장)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ★ 2026-09-22(빌드 10): 이 타깃만 스크립트 샌드박스를 끈다. 아래 postBuildScripts 의
        # '데모 픽스처 빼기' 와 샌드박스는 **구조적으로 양립하지 않는다** — 샌드박스는 선언된 출력에
        # 쓰기만 주고 읽기를 주지 않는데, `rm -rf` 는 지울 트리를 opendir 해야 한다. 그래서 Fixtures
        # 안 7개 절 전부가 `deny(1) file-read-data` 로 막혀 "Directory not empty" 로 아카이브가
        # 실패했다(빌드 9 는 같은 project.yml 로 통과했다 — 3일 사이 환경이 조여진 것으로 보인다).
        # 우회 둘 다 막혔다: 같은 경로를 inputFiles 에도 선언하면 빌드 순환(error: Cycle inside
        # AingCheck)이 되고, 출력 선언만으로는 읽기가 없어 재귀 삭제가 불가능하다.
        # ⚠ 이 줄은 **이 블록에 있어야 한다** — 타깃에 settings 키를 또 만들면 YAML 중복 키라 뒤 블록이
        # 앞을 덮어 조용히 사라진다(실측: 위쪽에 넣었더니 pbxproj 에 한 줄도 안 나갔다).
        # 픽스처가 정말 빠졌는지는 빌드 설정이 아니라 ios/scripts/check-release-app.sh 가 아카이브
        # 산출물을 열어 확인한다(릴리스 계약). 위젯 타깃은 샌드박스를 그대로 유지한다.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    postCompileScripts:
      # CheckConfig.plist 생성(맥 scripts/build-local.sh 와 같은 방식 — 키가 없으면 만들지 않는다). 키 값은 로그에 찍지 않는다.
      - name: CheckConfig.plist
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/CheckConfig.plist
        script: |
          set -eu
          OUT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/CheckConfig.plist"
          KEY="${CHECK_SUPABASE_ANON_KEY:-}"
          if [ -z "$KEY" ]; then
            rm -f "$OUT"
            echo "warning: CHECK_SUPABASE_ANON_KEY 가 없어 CheckConfig.plist 를 만들지 않았다 — 실서버 로그인은 안 되고 데모 모드만 된다(ios/scripts/sync-local-config.sh)."
            exit 0
          fi
          /usr/bin/plutil -create xml1 "$OUT"
          /usr/bin/plutil -insert CHECK_SUPABASE_ANON_KEY -string "$KEY" "$OUT"
    postBuildScripts:
      # dbase-fix: 데모 픽스처(Demo/Fixtures/**.json — 지어낸 사람·대화)를 **Release 번들에서 뺀다**. 읽는 코드(Demo/*.swift)는 #if DEBUG 라
      # Release 에 컴파일되지 않지만, SwiftPM 리소스(Package.swift 의 .copy("Demo/Fixtures"))는 구성과 무관하게 앱에 복사된다.
      # 서명(CodeSign)은 이 단계 뒤라 번들 봉인이 깨지지 않는다. 검사: ios/scripts/check-release-app.sh <AingCheck.app>.
      - name: Release 번들에서 데모 픽스처 빼기
        basedOnDependencyAnalysis: false
        # 통합(w4/int): 앱 안으로 복사된 패키지 리소스 번들을 **입력**으로 선언해 복사 뒤에 돌게 한다. 입력이 없을 때는 같은 derivedData
        # 증분 Release 에서 이 단계가 번들 복사보다 먼저 돌아 픽스처가 남았다(games 보고 · 통합에서 재현: 로그상 스크립트 → Copy 순).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/check_CheckMobileKit.bundle
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/check_CheckMobileKit.bundle/Fixtures
        script: |
          set -eu
          if [ "${CONFIGURATION}" != "Release" ]; then
            exit 0
          fi
          FIXTURES="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/check_CheckMobileKit.bundle/Fixtures"
          rm -rf "$FIXTURES"
          if [ -e "$FIXTURES" ]; then
            echo "error: Release 번들에서 데모 픽스처를 지우지 못했다: $FIXTURES"
            exit 1
          fi

  AingCheckWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    # 위젯 확장도 자기 번들에 CheckConfig.plist 를 싣는다(통합 w4/int — 지금 탭 base_request 4). 확장이 앱 번들(PlugIns 두 단계 위)을
    # 거슬러 읽는 우회는 걷어냈다: 샌드박스에서 되는지 보장이 없고, 확장 번들만으로 anon 키를 찾는 것이 맞다. 키 원천은 앱과 같은 xcconfig.
    configFiles:
      Debug: Config/AingCheck.xcconfig
      Release: Config/AingCheck.xcconfig
    dependencies:
      - package: check
        product: CheckWidgetsKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: 아잉체크
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/AingCheckWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yehsung.aingcheck
        keychain-access-groups:
          - MQ2KQK37WD.com.yehsung.aingcheck.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yehsung.aingcheck.widgets
        PRODUCT_NAME: AingCheckWidgets
        TARGETED_DEVICE_FAMILY: "1"
    postCompileScripts:
      # 앱 타깃과 같은 생성 단계(키가 없으면 만들지 않는다 — 위젯은 체크를 파일에만 남기고 앱이 active 때 올린다). 키 값은 로그에 찍지 않는다.
      - name: CheckConfig.plist
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/CheckConfig.plist
        script: |
          set -eu
          OUT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/CheckConfig.plist"
          KEY="${CHECK_SUPABASE_ANON_KEY:-}"
          if [ -z "$KEY" ]; then
            rm -f "$OUT"
            echo "warning: CHECK_SUPABASE_ANON_KEY 가 없어 위젯 CheckConfig.plist 를 만들지 않았다 — 위젯 체크는 앱이 active 때 올린다(ios/scripts/sync-local-config.sh)."
            exit 0
          fi
          /usr/bin/plutil -create xml1 "$OUT"
          /usr/bin/plutil -insert CHECK_SUPABASE_ANON_KEY -string "$KEY" "$OUT"

  # w5/e2e: 실서버 e2e(XCUITest). 운영 서버의 숨김 심사 계정 전용 — 자격 증명·토큰은 저장소에 두지 않고 실행 환경변수로만 받는다.
  # 앱 동작은 바꾸지 않는다(앱 번들에 실리지 않는 테스트 번들). 헤드리스 시뮬레이터에서 `xcodebuild test` 로만 돈다.
  AingCheckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AingCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yehsung.aingcheck.uitests
        PRODUCT_NAME: AingCheckUITests
        TEST_TARGET_NAME: AingCheck
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        # UI 테스트 번들은 XCTest 의 메인 액터 API 와 JSON 사전을 오가므로 Swift 5 모드로 둔다(앱·패키지는 Swift 6 그대로).
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
