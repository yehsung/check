# 데몬을 남기지 않는다: 봉인 밖에서 떠 있던 데몬을 봉인 안에서 재사용하면 봉인이 무력해진다(A§4-1).
# Gradle 은 일회용 데몬(자식 프로세스)을, Kotlin 은 Gradle 프로세스 안에서 컴파일한다.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configuration-cache=false
# JDK 를 내려받지 않는다(봉인 아래에서도 같은 JDK 21 을 쓴다).
org.gradle.java.installations.auto-download=false
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
# kotlin-test 의 JUnit 판은 소스셋마다 명시한다(데스크톱 JUnit5 · Android JUnit4). 자동 추론을 끈다.
kotlin.test.infer.jvm.variant=false
android.useAndroidX=true
android.nonTransitiveRClass=true
