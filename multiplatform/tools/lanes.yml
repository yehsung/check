# 갈래 소유 표 — G §2-3 + §8-3·§8-4 (W0-a 가 만든다, §8-3).
# multiplatform/tools/lane-ownership.py 가 읽는다: 브랜치 diff 가 갈래 소유 밖이거나, 옛 경로(§8-1)에 쓰거나,
# 예약 경로를 남이 건드리면 빨강이다. 이 파일은 W0 뒤로 조정자 몫이다.
#
# W0 통합(xplat/w0-int, 2026-10-21 밤)에서 정리한 것:
#   - W0-a 는 닫혔다(closed). W0-a 가 쥐던 빌드·봉인·CI·testkit·core/foundation·뼈대(scaffold) 자리는 이제 조정자 몫이다.
#   - AndroidManifest.xml 은 W1 동안 W1-g, W1 병합 뒤로는 조정자만 쓴다(그때 reserved 에서 W1-g 를 뺀다).
#   - 뼈대 패키지(ui·androidApp·desktopApp 의 scaffold)와 앱의 단일 HTTP 엔진 팩토리(http, G §8-12)는 조정자만.
#   - settingscommon(W3-b) · W3-c1~c4 하위 패키지 · ui/snapshots 자리는 '제안'에서 확정으로 바꿨다.
#   - W0-b(골든 바탕)·W0-c(서버 초안)·W0-d(굽기)는 아직 병합 전이라 그대로 둔다. W0-e(VM 몫)·W0-f(③⑤ 후속)도 열려 있다.
#
# 기준선 통합(xplat/int-a, 2026-10-22, G §8-13)에서 정리한 것:
#   - main 862be0f(0.3.62)를 기준선으로 병합했다. W0-c(서버 초안 시험·푸시 페이로드)·W0-d(굽기 도구·자산)를 병합하고 닫았다.
#     다시 굽기(bake.sh)·서버 ① 시험 손질(XplatServerMigrationTests)은 이제 조정자 경유다. 저장소 밖 xplat-staging 은 이 표와 무관.
#   - 통합 브랜치 이름에 xplat/int-<x> 를 더했다(lane-ownership.py --resolve-branch → coordinator).
#   - CI 소유 검사는 --upstream origin/main 으로 기준선 병합 몫(main 이 바꾸고 머리가 그대로 가져온 경로)을 뺀다.
#
# 3차 통합(xplat/int-b, 2026-10-22)에서 정리한 것:
#   - W1-e(디자인 시스템)·W1-f(Windows OS 층)·W1-g(Android 셸)·W0-b(골든 바탕)를 병합하고 닫았다. 그 자리(theme·components·icons·fonts,
#     platform/windows·AppGraph·Main, androidApp 셸 패키지·NavGraph, 골든 도구·testkit/golden·Package.swift 지원 타깃)는 조정자 경유다.
#   - AndroidManifest.xml · composeResources · AppGraph/Main · NavGraph 예약에서 갈래를 빼 조정자만 남겼다(K11, §8-3).
#   - 골든 생성물(_manifest·_digests)은 골든 갈래가 자기 브랜치에서 다시 만들어 커밋한다(W0-b 패치 03). 병합 때는 조정자가 다시 만든다(G §2-5).
#
# 5차 기준선 통합(xplat/int-d, 2026-10-28, G §8-16)에서 정리한 것:
#   - main 1b8260d(맥 0.3.67 · 폰 1.0.14)를 기준선으로 병합했다. 새·바뀐 Swift 로직의 갈래 배정표는 저장소 밖
#     ~/.claude/projects/-Users-yesung-check/xplat-design/results/round5-lane-map.md(파일 · 줄 수 · 갈래 · Kotlin 자리 · 골든 폴더).
#   - 새 골든 폴더: crossy(W1-a, 길건너 엔진) · missions·gift(W1-c, 일일 미션 · 케이크 선물) · messages(W2-b, 네 무리 정렬 · 찌르기 기록).
#     골든 폴더가 생긴 W2-b 를 생성물(_manifest·_digests) 예약에 더했다.
#   - W1-d 에 testkit 의 G6 디코드 덤프기 자리(testkit/…/dump)를 줬다 — 스토어 갈래(W2-*)도 같은 덤프기를 쓴다. kotlin-reflect 는 조정자가
#     testkit desktopMain·androidMain 에 넣었다(§8-14).
#
# 5차 통합(xplat/int-e, 2026-10-28, G §8-16)에서 정리한 것:
#   - W1-a(테트리스·미니게임·길건너)·W1-b(렌주·체스·AI·판돈 수수료)·W1-c(앱 규칙)·W1-d(와이어·통신·실시간)·W2-i(웹 계정 삭제)를
#     병합하고 닫았다. 그 자리(core/rules 의 갈래 패키지 · core/wire · core/net · testkit/…/dump · GoldenExport 생성기 · 골든 폴더 ·
#     landing 계정 삭제)는 이제 조정자 경유다. W0-f 는 ⑤(FCM 토큰 실측)가 남아 열어 둔다.
#   - W1-c 의 글자 규칙·내장 id 는 W1-d 와이어 한 벌로 접었다(core/rules …/text 의 RulesWireTextRules 가 WireTextRules 를 꽂는다).
#   - 닫힌 W1-a~d 를 생성물(_manifest·_digests) 예약에서 뺐다(닫힌 갈래는 예약에 둘 수 없다 — --validate).
#
# 6차 게이트 수리(xplat/int-f, 2026-10-28, G §8-17 5)에서 정리한 것:
#   - W0-f 소유 multiplatform/scripts/emu.sh 를 조정자(대리)가 고쳤다(coordinator owns "multiplatform/**" — 예약 경로 아님):
#     에뮬레이터마다 전용 netsim 발견 폴더(TMPDIR) · sealcheck 가 netsim Wi-Fi 길까지 잰다 · 창 판정은 자기 PID 나무만(§8-6).
#     W0-f(⑤ 로 열림)가 emu.sh 를 더 고치면 xplat/main(int-f 이후)에서 딴다.
#
# 6차 조정자 접기(xplat/c-fold, 2026-10-28, G §8-17 2 (a) · 4)에서 정리한 것:
#   - 브랜치 이름 xplat/c-<x> 를 조정자로 푼다(lane-ownership.py --resolve-branch → coordinator — 조정자 패치 01).
#   - core/stores 에 조정자 자리 둘(어느 갈래 owns 에도 없다 — 갈래가 고칠 일이면 패치로 낸다):
#       …/stores/service/RulesServiceCalls.kt — Swift 서비스 함수 가운데 반환 타입이 rules 인 것(상태메시지 저장 · 업적 · 일일 미션 ·
#         주간 근무 · 확성기 · 내 AI 리밋)의 net 요청 + rules 디코드 합성 한 벌. 스토어 갈래(W2-b 메시지 · W2-c 나 · 미션 화면)는 이 함수를
#         부르고 다시 합성하지 않는다(G5 골든이 이 함수를 그대로 부른다).
#       src/desktopTest/…/stores/wiregolden — G5 요청 골든 대조(core/net 에서 옮김, 실제 RulesWireTextRules).
#   - W2-c 자리(…/stores/me)에 AILimitFetchedRow.kt · 시험 AILimitFetchedRowTest.kt 를 먼저 냈다(행 거르기 한 자리 — net 은 거르지 않는다).
#     W2-c 는 이것을 부르기만 하고 다시 만들지 않는다(위임문에 적는다). AILimitPlanLabelContract 는 rules/ailimit(골든 dates/ailimit plan-labels).
#
# 6차 통합(xplat/int-h, 2026-10-28, G §8-17)에서 정리한 것:
#   - c-fold · W0-f(⑤ FCM 토큰 실측) · W5-a(캐릭터 재생기 · 픽셀 대조) · W2-a(세션) · W2-b(메시지·지금·순위·할 일) · W2-c(나 탭) ·
#     W2-d(오목·체스) · W2-e(게임 허브·테트리스 대결·미니게임)를 병합하고 W0-f · W5-a · W2-a~e 를 닫았다. 그 자리(emu.sh · character ·
#     core/session · core/stores 의 갈래 패키지 · 골든 session·messages·duel·pause · GoldenExport 생성기 · 굽기 골든)는 이제 조정자 경유다.
#   - 닫힌 W2-a · W2-b · W2-e 를 생성물(_manifest·_digests) 예약에서 뺐다.
#   - W1-c 가 'W2' 로 넘긴 할 일 엔진(TodoSync · TodoListStore · TodoFileStore · NowTodoSupport)은 core/stores …/now/todo(W2-b 가 옮김)에 있다.
#   - 루비 칸은 하나다: W2-c core/stores …/me RubyBalanceMirror. 오목·체스 호스트(SessionGomokuHost)는 칸을 갖지 않고 빌린다(W2-d 패치 02).
#   - W2-f(Android 로직 — 폰 문맥 · 라우터 · 위젯 · 실시간)는 열려 있다. xplat/main(int-h 이후)에서 딴다.
#
# 7차 기준선(xplat/int-i, 2026-10-28, G §8-18)에서 정리한 것:
#   - main 3bd04bd(서버 ① — V0341 M2 오목 덮어쓰기 8건 · XplatServerMigrationTests 상시화)를 병합했다. 그 시험 파일은 main 판을 받았다(§8-18 11).
#   - 7차 웨이브는 W2-f · W3-a · W3-b · W4-a · W4-b · W4-c · W5-c · W6-a · W6-c 아홉 갈래가 함께 돈다(§8-18 8). --validate 가 열린 갈래끼리
#     소유 겹침 0 을 잰다(겹치면 종료 1). 화면 갈래는 내비게이션 배선 없이 화면까지 — Android 조립(K11) 자리는 조정자 예약이다(위 reserved).
#   - W5-c title 의 낡은 '결정 #2 대기'를 고쳤다(결정 #2 는 10-21 사용자 답으로 정해져 있다 — results/round6-w2.json intH).
#   - 계약 골든 예산 12 MiB(golden-digest.py TOTAL_BUDGET · §8-18 6) · build-logic 시험 작업의 선언 입력 contract/golden(§8-18 9) ·
#     Gboard 한국어 AVD aingcheck-api36-ko 를 emu.sh 공용 AVD(SHARED_AVDS — 읽기 전용만)로(W3-a IME 재생 시험이 쓴다).
#
# 7차 병합(xplat/int-j, 2026-10-29, G §8-18 8)에서 정리한 것:
#   - W2-f · W3-a · W3-b · W4-a · W4-b · W4-c · W5-c · W6-a · W6-c 아홉 갈래를 --no-ff 로 병합하고 닫았다. 그 자리(androidApp 폰 다리 ·
#     ui/screens · ui/games · ui/shop·gacha · 무대 · 출시 스크립트 · docs/android)는 이제 조정자 경유다.
#   - 조정자 패치 가운데 K11 조립 지점(NavGraph.kt · AndroidManifest.xml·res/xml · AppContainer.kt·MainActivity) 셋(W3-a 02 · W3-b 0001·0002)은
#     얹지 않았다 — 다음 조립 갈래가 xplat-r7/int-j/assembly-all.md 대로 얹는다.
#   - W2-f 가 넘긴 AILimit 그리기 규약 INV 7건(AILimitColumnStyle 6 · AILimitSurfaceRules 1)은 W3-b 몫이었다(W2-f assembly.md §5 ID 목록).
#     W3-b 가 닫혔으므로 남은 커버리지는 조정자 몫이다.
#
# 문법(이 파일이 쓰는 YAML 부분집합 — 도구가 직접 읽는다):
#   매핑(키: 값 / 키: 아래 들여쓰기), 블록 목록("- 값"), 흐름 목록([a, b]), 따옴표 문자열, # 주석.
# 경로 글롭: 저장소 뿌리 기준. "**" = 0개 이상 경로 마디, "*" = 한 마디 안, "{a,b}" = 고르기.
#   {pkg:<모듈>} 은 아래 package_root 의 Kotlin 패키지 폴더로 바뀐다.
#   G 의 "…/" 약어 = src/*/kotlin/{pkg:<모듈>}.
# G 가 하위 패키지를 정하지 않은 자리(settingscommon · W3-c1~c4 · ui/snapshots)는 W0-a 가 제안하고 W0 통합에서 확정했다.

version: 1

# 닫힌 갈래: 그 이름으로 오는 변경은 경로와 상관없이 빨강이다(후속 수정은 조정자 경유).
closed: [W0-a, W0-c, W0-d, W1-e, W1-f, W1-g, W0-b, W1-a, W1-b, W1-c, W1-d, W2-i, W0-f, W5-a, W2-a, W2-b, W2-c, W2-d, W2-e, W2-f, W3-a, W3-b, W4-a, W4-b, W4-c, W5-c, W6-a, W6-c]

# 모듈 → Kotlin 패키지 폴더(A§2-2: 뿌리 com.yehsung.aingcheck, 모듈과 1:1. 앱은 android·desktop).
package_root:
  core/foundation: com/yehsung/aingcheck/core/foundation
  core/wire: com/yehsung/aingcheck/core/wire
  core/net: com/yehsung/aingcheck/core/net
  core/rules: com/yehsung/aingcheck/core/rules
  core/session: com/yehsung/aingcheck/core/session
  core/stores: com/yehsung/aingcheck/core/stores
  feature/phone: com/yehsung/aingcheck/feature/phone
  feature/desktop: com/yehsung/aingcheck/feature/desktop
  ui: com/yehsung/aingcheck/ui
  character: com/yehsung/aingcheck/character
  testkit: com/yehsung/aingcheck/testkit
  androidApp: com/yehsung/aingcheck/android
  desktopApp: com/yehsung/aingcheck/desktop

# §8-1 옛 경로 — 어느 갈래든 쓰면 빨강(저장소 꼭대기 기준). supabase/ 는 git 밖이고 서버 초안은 저장소 밖에 둔다.
forbidden:
  - "xplat/**"
  - "kmp/**"
  - "contracts/**"
  - "tools/**"
  - "backups/**"
  - "supabase/**"

# 예약 경로: 갈래의 owns 글롭이 덮더라도 여기 적힌 갈래만 쓸 수 있다(나머지는 완료 보고에 패치로 낸다).
reserved:
  "multiplatform/settings.gradle.kts": [coordinator]
  "multiplatform/build.gradle.kts": [coordinator]
  "multiplatform/gradle.properties": [coordinator]
  "multiplatform/{gradlew,gradlew.bat}": [coordinator]
  "multiplatform/gradle/**": [coordinator]
  "multiplatform/build-logic/**": [coordinator]
  # 이 빌드의 모듈 빌드 파일. spikes/windows 는 자기 완결 Gradle 빌드(W0-e 소유, 출시 빌드 제외)라 여기 들지 않는다.
  "multiplatform/{*,core/*,feature/*}/build.gradle.kts": [coordinator]
  "multiplatform/version.properties": [coordinator]
  "multiplatform/tools/{lanes.yml,lane-ownership.py}": [coordinator]
  # W1 동안 W1-g 가 썼고(Activity·권한·채널·백업 제외·launchMode — E-U16), W1-g 병합(xplat/int-b) 뒤로는 조정자만(K11, §8-3).
  "multiplatform/androidApp/src/main/AndroidManifest.xml": [coordinator]
  "multiplatform/androidApp/src/main/res/xml/**": [coordinator]
  # 뼈대(빌드·하네스가 도는지만 재는 자리)와 앱의 단일 HTTP 엔진 팩토리(G §8-12 · 구조 시험 R3c)는 조정자만 고친다.
  "multiplatform/ui/src/*/kotlin/{pkg:ui}/scaffold/**": [coordinator]
  "multiplatform/androidApp/src/*/kotlin/{pkg:androidApp}/{scaffold,http}/**": [coordinator]
  "multiplatform/desktopApp/src/*/kotlin/{pkg:desktopApp}/{scaffold,http}/**": [coordinator]
  "multiplatform/scripts/{seal.sb,gate-fast.sh,gate-full.sh,canary-contrast.sh,apk-native-check.sh,apk-native-allowlist.txt}": [coordinator]
  # 새 자산 추가·조립 지점은 W1-e·f·g 병합(xplat/int-b) 뒤로 조정자만(§8-3 · K11). 갈래는 완료 보고에 패치로 낸다.
  "multiplatform/ui/src/*/composeResources/**": [coordinator]
  "multiplatform/desktopApp/src/main/kotlin/{pkg:desktopApp}/{AppGraph,Main}.kt": [coordinator]
  "multiplatform/androidApp/src/main/kotlin/{pkg:androidApp}/nav/NavGraph.kt": [coordinator]
  # 7차(G §8-18 8): 화면 갈래는 내비게이션 배선 없이 화면까지 — Android 조립(K11: 그릇 AppContainer · Application.onCreate 의 알림 채널
  # 다섯 · appConfig.duelsEnabled 를 BuildConfig 에서 읽는 한 곳 · 위 NavGraph)은 통합 갈래(조정자)만 고친다. 갈래는 패치로 낸다.
  "multiplatform/androidApp/src/main/kotlin/{pkg:androidApp}/app/{AppContainer,AingApplication,AndroidAppConfig}.kt": [coordinator]
  "multiplatform/androidApp/src/main/kotlin/{pkg:androidApp}/push/NotificationChannels.kt": [coordinator]
  # 생성물(golden-export.sh 쓰기 모드가 영수증·지문으로 다시 만든다). 골든을 더하는 갈래는 자기 브랜치에서 다시 만들어 커밋해야
  # 그 브랜치의 비교 모드·CI golden-digest 가 초록이다. 병합 때 두 파일이 부딪히면 어느 쪽이든 받고 쓰기 모드로 다시 만든다(G §2-5).
  "contract/golden/{_manifest,_digests}.json": [W2-g, W2-h, coordinator]
  ".gitignore": [coordinator]

# 조정자(메인 에이전트) 몫 공용 조립 파일(K11 + §8-3). 웨이브 병합 때만 고친다.
coordinator:
  owns:
    - "multiplatform/**"
    - "contract/**"
    - ".github/workflows/mp-*.yml"
    - ".gitignore"
    - "Package.swift"
    - "Tests/**"
    - "scripts/golden-export.sh"
    - "landing/**"
    - "docs/**"

lanes:
  # ---------------- W0 ----------------
  W0-a:
    wave: W0
    title: 빌드·봉인·CI(닫힘 — W0 통합 뒤 이 자리는 조정자 몫, 아래 목록은 기록)
    owns:
      - "multiplatform/{settings,build}.gradle.kts"
      - "multiplatform/gradle.properties"
      - "multiplatform/{gradlew,gradlew.bat}"
      - "multiplatform/gradle/**"
      - "multiplatform/build-logic/**"
      - "multiplatform/version.properties"
      - "multiplatform/*/build.gradle.kts"
      - "multiplatform/{core,feature}/*/build.gradle.kts"
      - "multiplatform/testkit/**"
      - "multiplatform/core/foundation/**"
      - "multiplatform/scripts/{seal.sb,gate-fast.sh,gate-full.sh}"
      - "multiplatform/tools/{lanes.yml,lane-ownership.py}"
