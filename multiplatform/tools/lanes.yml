    title: AI·데스크톱 설정(하위 패키지 이름은 제안)
    owns:
      - "multiplatform/desktopApp/src/*/kotlin/{pkg:desktopApp}/pages/{aitokens,ailimits,devices,desktopsettings}/**"
    golden: []

  W3-d:
    wave: W3
    title: Windows 연결
