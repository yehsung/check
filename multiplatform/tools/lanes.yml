  # ---------------- W3 (§8-4: 공용 화면은 ui/screens 한 벌, 앱 쪽은 껍데기만) ----------------
  W3-a:
    wave: W3
    title: 화면 1(세션·지금·메시지·프로필)
    owns:
      - "multiplatform/ui/src/*/kotlin/{pkg:ui}/screens/{session,messages,profile}/**"
      - "multiplatform/ui/snapshots/screens/{session,messages,profile}/**"
      - "multiplatform/androidApp/src/*/kotlin/{pkg:androidApp}/screens/{session,now,messages}/**"
      - "multiplatform/desktopApp/src/*/kotlin/{pkg:desktopApp}/pages/{session,messages,profile}/**"
    golden: []

  W3-b:
    wave: W3
    title: 화면 2(순위·나·설정·위젯) — 공용 설정 패키지는 settingscommon(제안, '-' 는 패키지 이름에 못 쓴다)
