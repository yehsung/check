# K4 ClientIdentity 의 원천 — (platform, build, version) 을 여기 한 곳에서 만든다.
# Android versionCode·Windows build 는 맥(CFBundleVersion)·iOS 빌드와 **다른 축**이다(W-나).
# 서버의 *_android_min_build·client_release('android'|'windows') 도 이 축을 쓴다.
# W0 이후에는 조정자 몫 공용 파일이다(§8-3). 출시 갈래(W6)는 필요한 줄을 패치로 낸다.

# Android: versionCode 는 단조 증가 정수(서버 app_build 범위 1..1,000,000 — K5)
# 1 = 운영 판돈 e2e 빌드 · 2 = Play 첫 업로드 판(장부 cb8b5e62) · 3 = 테트리스 한 기기 판(장부 96cb8b17 빌드) · 4 = 확성기 배너·작은 화면 수정 판(장부 d99c319b 빌드) → 다음 출시는 5(ReleaseVersionCodeTest). versionName 은 장부가 같은 이름을 막지 않아(release_tool preflight 는 번호만 잰다) 그대로.
androidVersionCode=5
androidVersionName=1.0.0
# 판돈 깃발(이중 확인 한쪽 — 다른 쪽은 출시 인자 --duels on): 판돈 e2e 를 통과할 첫 빌드 — G §8-17 #1, versionCode 1.
androidDuelsFromBuild=1

# Windows: MSI 버전 칸 MAJOR.MINOR.BUILD(MAJOR·MINOR ≤ 255, BUILD ≤ 65535 — A§6-2).
# windowsVersion 의 셋째 칸은 windowsBuild 와 같아야 한다(빌드가 검사한다).
windowsBuild=1
windowsVersion=1.0.1

# MSI upgradeUuid — 영구 식별자(A§9-7). G §8-13 에서 잠갔다(임의 값이라 사용자 확인은 필요 없고, 중요한 건 바꾸지 않는 것).
# 바꾸면 새 판이 옛 판을 업그레이드로 못 알아봐 둘이 나란히 깔린다. 값 고정 시험: desktopApp PermanentIdentifierPinTest.msiUpgradeUuidIsPinned.
windowsUpgradeUuid=6798ece1-0749-4a92-856f-ca1f4847c522
